<!DOCTYPE html>
<html>
<head>
  <title>Fantasy Focus Realm</title>
  <link rel="stylesheet" href="focus.css">
</head>
<body>
  <div class="overlay">
    <div class="scene">
      <div class="scene-header">
        <h1>
          <span class="wizard-emoji">🧙</span>
          <span class="seal-title">THE GATE OF DISTRACTIONS IS SEALED</span>
          <span class="wizard-emoji">🧙</span>
        </h1>
      </div>
      <div class="dragon-row">
        <img src="dragon.png" class="dragon dragon-left" alt="Left dragon">
        <div class="message-content">
          <p class="focus-message">
            The pixel dragon guards your focus.<br>
            Your current quest is to study, not to wander these lands of distraction.
          </p>
          <p class="hint">
            You may <strong>defy the dragons</strong> just this once...
            if this site is truly part of your quest.
          </p>
          <button id="overrideBtn" class="override-btn">
            Defy the Dragons... (OVERRIDE)
          </button>
        </div>
        <img src="dragon.png" class="dragon dragon-right" alt="Right dragon">
      </div>
    </div>
  </div>
  <script src="focus.js"></script>
</body>
</html>
