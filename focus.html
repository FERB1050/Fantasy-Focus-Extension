<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Fantasy Focus Realm</title>
    <link rel="stylesheet" href="focus.css">
  </head>
  <body>
    <div class="container">
      <h1>🧙‍♂️ The Gate of Distractions is Sealed</h1>
      <p>
        The dragons guard your focus. Your current quest is to study, not to wander these lands of distraction.
      </p>
      <button id="overrideBtn">Break the spell (go back)</button>
    </div>

    <script>
      document.getElementById("overrideBtn").addEventListener("click", () => {
        history.back();
      });
    </script>
  </body>
</html>
