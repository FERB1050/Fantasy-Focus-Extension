<!DOCTYPE html>
<html>
  <head>
     <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Fantasy Focus Realm</title>
    <link rel="stylesheet" href="focus.css">
  </head>
  <body>
    <div class="overlay">
      <div class="scene">
        <div class="dragon-wrap">
          <img src="dragon.png" class="dragon" alt="Pixel dragon guardian">
        </div>
        <div class="message-box">
          <h1>🧙‍♂️THE GATE OF DISTRACTIONS IS SEALED🧙‍♂️</h1>
          <p>
            The pixel dragon guards your focus. Your current quest is to study,
            not to wander these lands of distraction.
          </p>
          <p class="hint">
            You may <strong>defy the dragons</strong> just this once... if this site is truly part of your quest.
          </p>
          <button id="overrideBtn" style="font-weight: bold;">
            Defy the Dragons... (OVERRIDE)
          </button>
        </div>
      </div>
    </div>

    <script src="focus.js"></script>
  </body>
</html>
