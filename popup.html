<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fantasy Focus Mode</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="overlay">
        <div class="scene">
            <div class="message-box">
                <h1 class="popup-title">✨ Fantasy Focus Mode ✨</h1>
                <p class="popup-subtitle">The pixel dragons guard your focus.<br>
                Only brave souls may break their watch!</p>
                <div style="margin: 16px 0;">
                  <label>
                    <input type="checkbox" id="focusToggle" /> Focus Mode ON
                  </label>
                </div>
            </div>
            <div class="section-title">🚫 Blocked Sites</div>
            <ul id="blockedList"></ul>
            <input type="text" id="newSiteInput" placeholder="Add a site (ex: www.site.com)">
            <button id="addSiteBtn">Add Site to Blocklist</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
