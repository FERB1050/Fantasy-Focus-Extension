<head>
  <link rel="stylesheet" href="focus.css">
  <style>
    html, body {
      width: 320px;
      min-height: 380px;
      margin: 0;
      padding: 0;
    }
    body {
      background: url('bg.jpg') center center / cover no-repeat fixed !important;
      image-rendering: pixelated;
      font-family: "Press Start 2P", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.35);
      min-height: 100vh;
      min-width: 100vw;
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
      pointer-events: none;
    }
    .scene {
      padding: 20px 10px 10px 10px;
      background: rgba(10, 10, 20, 0.7);
      border-radius: 12px;
      border: 2px solid #f8f0e3;
      max-width: 280px;
      margin: 40px auto 8px auto;
      box-sizing: border-box;
    }
    .message-box {
      color: #f8f0e3;
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
