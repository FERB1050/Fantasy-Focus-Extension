<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Fantasy Focus</title>
  <!-- Link to fantasy-themed CSS (make sure it's present or adjust the path) -->
  <link rel="stylesheet" href="focus.css">
  <style>
    /* Ensures popup fits the Chrome action bounds and all controls are visible */
    body, html {
      width: 320px;
      min-height: 380px;
      margin: 0;
      padding: 0;
    }
    /* Overwrite scene for a tighter popup if desired */
    .scene {
      flex-direction: column;
      gap: 8px;
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
    }
    .dragon-wrap {
      margin-bottom: 8px;
    }
    .site-controls, .blockedList, #newSiteInput, #addSiteBtn {
      width: 90%;
      margin: 0 auto 8px auto;
      display: block;
    }
    ul#blockedList {
      list-style: none;
      padding-left: 0;
      max-height: 120px;
      overflow-y: auto;
      background: rgba(10, 10, 20, 0.5);
      border-radius: 6px;
      margin-bottom: 12px;
    }
    ul#blockedList li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding: 2px 8px;
      color: #f8f0e3;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="scene">
      <div class="dragon-wrap">
        <img src="dragon.jpg" class="dragon" alt="Pixel dragon guardian">
      </div>
      <div class="message-box">
        <h1>Fantasy Focus Mode</h1>
        <p id="statusText"></p>
      </div>
      <label>
        <input type="checkbox" id="focusToggle">
        Focus Mode ON
      </label>
    </div>
  </div>
  <div class="section-title" style="margin-left:20px; color:#f8f0e3;">Blocked Sites</div>
  <ul id="blockedList"></ul>
  <input type="text" id="newSiteInput" placeholder="Add site. Use Format www.site.com">
  <button id="addSiteBtn">Add Site to Blocklist</button>
  <script src="popup.js"></script>
</body>
</html>
