<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fantasy Focus Mode</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="overlay">
    <div class="scene">
      <div class="message-box">
        <h1>Fantasy Focus Mode</h1>
        <p id="statusText">
          Focus Mode is <span style="color:#FFB300;">OFF</span>.<br>
          The dragons guard your focus, awaiting your command.
        </p>
      </div>
      <div class="toggle-container">
        <label>
          <input type="checkbox" id="focusToggle" />
          <span class="toggle-label">Activate Dragon Guard</span>
        </label>
      </div>
      <div class="section-title">Sites Locked Away in the Dungeon</div>
      <ul id="blockedList"></ul>
      <input type="text" id="newSiteInput" placeholder="Add a distracting site (e.g., www.youtube.com)" />
      <button id="addSiteBtn">Imprison Site</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
